stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE_TAG: $DOCKER_REGISTRY/$DOCKER_REPOSITORY:books-api-$CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE_TAG .
    - docker push $DOCKER_IMAGE_TAG

unit-tests:
  stage: test
  image: $DOCKER_IMAGE_TAG
  script:
    - pytest -vv tests/unit
